<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CISSÉ PIÈCES DÉTACHÉES - CLOUD</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#1e293b;padding:30px;border-radius:15px;text-align:center;max-width:400px;width:90%}
h1{color:#22c55e;margin:0 0 10px}
input{width:90%;padding:12px;margin:10px 0;border-radius:8px;border:none;font-size:18px;text-align:center}
button{background:#22c55e;color:white;border:none;padding:12px 30px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
.stock{margin-top:20px;background:#0f172a;padding:15px;border-radius:10px;text-align:left}
</style>
</head>
<body>
<div class="card">
<h1>✅ CISSÉ PIÈCES</h1>
<p>VERSION CLOUD UNIQUE</p>
<input type="password" id="pin" placeholder="PIN: 0000">
<button onclick="login()">OUVRIR MAGASIN</button>
<div id="app" style="display:none">
<h2>Stock en ligne</h2>
<div class="stock">
<p>✅ Plus de 2 versions !</p>
<p>✅ Tout est synchronisé</p>
<p id="date"></p>
</div>
<button onclick="location.reload()">Déconnexion</button>
</div>
</div>
<script>
function login(){
if(document.getElementById('pin').value==='0000'){
document.getElementById('app').style.display='block';
document.getElementById('date').innerText='Connecté: '+new Date().toLocaleString();
}else{alert('PIN incorrect: 0000')}
}
</script>
</body>
</html>

 const per=(len,fm)=>({C:[["Période","t"],["Nb factures","i"],["Total net (FCFA)","m"],["Encaissé (FCFA)","m"],["Reste (FCFA)","m"]],rows:grp(F,f=>(f.date||"").slice(0,len)).map(g=>[fm(g[0]),g[1].length,sum(g[1],f=>f.total),sum(g[1],f=>f.paye),sum(g[1],rest)]),kp});

 if(t=="produit"){const L=[];F.forEach(f=>facData(f).L.forEach(l=>L.push(l)));return{C:[["Produit","t"],["Qté vendue","i"],["Montant (FCFA)","m"]],rows:grp(L,l=>l.nom||l.d).map(g=>[g[0],sum(g[1],l=>l.q),sum(g[1],l=>l.q*l.pu)]),kp}}

 if(t=="sa"||t=="sv"){const k=t=="sa"?"achat":"vente";return{C:[["Produit","t"],["Dépôt","t"],["Stock","i"],[t=="sa"?"Prix d’achat":"Prix de vente","p"],["Valeur (FCFA)","m"]],rows:D.produits.map(p=>[p.nom,p.depot||dep,num(p.stock),num(p[k]),num(p.stock)*num(p[k])])}}

function pimg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL("image/jpeg",.7)};im.src=r.result};r.readAsDataURL(f)}
function fld(f,e){
 if(f.t=="image")return `<input type="file" accept="image/*" onchange="pimg(this)">${e.img?`<img src="${e.img}" style="width:60px;margin-top:6px;border-radius:8px">`:""}`;
 if(f.t=="select")return `<select id="f_${f.k}">${f.o.map(x=>`<option ${e[f.k]==x?"selected":""}>${x}</option>`).join("")}</select>`;
 if(f.t=="dep")return `<select id="f_${f.k}">${D.depots.map((d,i)=>`<option value="${esc(d.nom)}" ${e[f.k]==d.nom?"selected":""}>${esc(d.nom)}${i?"":" (par défaut)"}</option>`).join("")}</select>`;
 return `<input id="f_${f.k}" type="${f.t}" value="${esc(e[f.k]??(f.t=="date"?today():""))}">`;
}

 const c=M[k],e=id!=null?(D[k].find(r=>r.id==id)||{}):{};const o=$("md");if(o)o.remove();edit=id??null;IMG=null;

 c.f.forEach(f=>{if(f.t=="image")return;const v=$("f_"+f.k).value;o[f.k]=f.t=="number"?num(v):v});
 if(k=="produits"&&IMG)o.img=IMG;
 if(edit!==null){Object.assign(D[k].find(r=>r.id==edit),o);log(c.n+" : modification")}else{o.id=Date.now();D[k].push(o);log(c.n+" : ajout "+(o.nom||o.libelle||o.client||""))}

let FL=[];
function nextNum(){return "FAC-"+new Date().getFullYear()+"-"+String(D.factures.length+1).padStart(4,"0")}
function fls(){return FL.map((l,i)=>`<div style="display:grid;grid-template-columns:1fr 60px 90px;gap:6px;margin-bottom:8px"><input placeholder="Désignation" value="${esc(l.d)}" oninput="FL[${i}].d=this.value"><input type="number" value="${l.q}" oninput="FL[${i}].q=num(this.value);facT()"><input type="number" value="${l.pu}" oninput="FL[${i}].pu=num(this.value);facT()"><div style="text-align:right;font-weight:700" id="lt${i}">${fmt(l.q*l.pu)}</div><button class="b" onclick="FL.splice(${i},1);$('fl').innerHTML=fls();facT()">×</button></div>`).join("")}
function facT(){const b=sum(FL,l=>l.q*l.pu),r=num($("fr").value);$("fb").textContent="Total brut : "+fmt(b);$("ft").textContent="Remise : "+fmt(b*r/100)+" · Total à payer : "+fmt(b*(1-r/100));FL.forEach((l,i)=>{const e=$("lt"+i);if(e)e.textContent=fmt(l.q*l.pu)})}
function addFP(v){const p=D.produits.find(x=>x.nom==v),s=D.services.find(x=>x.nom==v);if(!p&&!s)return;if(FL.length==1&&!FL[0].d&&!FL[0].pu)FL=[];FL.push(p?{d:p.nom,q:1,pu:num(p.vente),pid:p.id,pa:num(p.achat)}:{d:s.nom,q:1,pu:num(s.prix)});$("fl").innerHTML=fls();facT()}

 <div style="text-align:right"><b id="fb">Total brut : 0 FCFA</b></div><label>Acompte versé</label><input id="fa" type="number" value="0">

 const L=FL.filter(l=>l.d||l.pu);if(!L.length)return alert("Ajoutez au moins une ligne.");
 const brut=sum(L,l=>l.q*l.pu),r=num($("fr").value),total=Math.round(brut*(1-r/100)),st=$("fs").value;
 const c=D.clients.find(x=>x.id==cli),f0=EDF!=null?D.factures.find(x=>x.id==EDF):null,cname=c?c.nom:(f0?f0.client:D.clients[0].nom);
 if(f0&&dedF(f0.statut))stk(f0.lignes,1);

 const tb=rows.length?`<div class="sc"><table><tr>${c.f.map(f=>`<th>${f.l}</th>`).join("")}<th></th></tr>${rows.map(r=>`<tr>${c.f.map(f=>`<td>${f.t=="number"?(/prix|achat|vente|total|montant|paye|solde|cout|rembourse/.test(f.k)?fmt(r[f.k]):esc(r[f.k])):esc(r[f.k])}</td>`).join("")}<td style="white-space:nowrap"><button class="b s" onclick="edit=${r.id};render();scrollTo(0,0)">✏️</button> <button class="b s o" onclick="del('${k}',${r.id})">🗑</button></td></tr>`).join("")}</table></div>`:`<div class="empty">Aucun enregistrement.</div>`;

function tblU(){const rows=D.utilisateurs.filter(r=>hit(r,q));
 return `<div class="sc"><table><tr><th>Nom</th><th>Rôle</th><th>Code</th><th>Pages autorisées</th><th></th></tr>${rows.map(r=>{const adm=r.id===1,n=MENU.filter(m=>(r.droits&&r.droits[m[0]]||"").includes("v")).length;return `<tr><td>${esc(r.nom)}</td><td>${esc(r.role)}</td><td>••••</td><td>${adm?"Toutes (accès complet)":n+" / "+MENU.length}</td><td style="white-space:nowrap">${can("utilisateurs","m")?`<button class="b s" onclick="openUser(${r.id})">✏️</button> `:""}${can("utilisateurs","s")&&!adm?`<button class="b s o" onclick="del('utilisateurs',${r.id})">🗑</button>`:""}</td></tr>`}).join("")}<tr><td colspan="5"><b>Total (${rows.length})</b></td></tr></table></div>`}

function preset(r){const P=PRESET[r];if(!P)return;MENU.forEach(m=>ACT.forEach(a=>{const c=$("r_"+m[0]+"_"+a[0]);if(c)c.checked=(P[m[0]]||"").includes(a[0])}))}
function openUser(id){
 if(id==null?!can("utilisateurs","a"):!can("utilisateurs","m"))return alert("Action non autorisée");
 const e=id!=null?(D.utilisateurs.find(u=>u.id==id)||{}):{},adm=e.id===1,dr=e.droits||{};edit=id??null;
 const o=$("md");if(o)o.remove();

 const d=document.createElement("div");d.id="md";
 d.innerHTML=`<div class="box" style="max-width:640px"><h2 class="t" style="font-size:30px">${id!=null?"Modifier":"Nouveau"} — Utilisateur</h2><label>Nom</label><input id="uf_n" value="${esc(e.nom||"")}"><label>Rôle</label>${adm?`<input readonly value="Administrateur">`:`<select id="uf_r" onchange="preset(this.value)">${["Vendeur","Magasinier","Gérant","Autre"].map(r=>`<option ${e.role==r?"selected":""}>${r}</option>`).join("")}</select>`}<label>Code de connexion (4 chiffres)</label><input id="uf_p" inputmode="numeric" maxlength="4" value="${esc(e.pin||"")}">${grid}<div class="bar" style="justify-content:space-between"><button class="b" onclick="closeM()">Annuler</button><button class="b o" onclick="saveUser()">Enregistrer</button></div></div>`;
 document.body.appendChild(d);
 if(!adm&&id==null)preset("Vendeur");

function saveUser(){
 const e=edit!==null?D.utilisateurs.find(u=>u.id==edit):null,adm=!!e&&e.id===1;
 const nom=$("uf_n").value.trim(),pin=$("uf_p").value.trim();
 if(!nom)return alert("Entrez le nom.");
 if(!/^\d{4}$/.test(pin))return alert("Le code doit avoir exactement 4 chiffres.");
 if(D.utilisateurs.some(u=>u!==e&&u.pin===pin))return alert("Ce code est déjà utilisé par un autre utilisateur.");
 const dr={};if(!adm)MENU.forEach(m=>{let t="";ACT.forEach(a=>{const c=$("r_"+m[0]+"_"+a[0]);if(c&&c.checked)t+=a[0]});if(t&&!t.includes("v"))t="v"+t;if(t)dr[m[0]]=t});

 if(e){Object.assign(e,o);log("Utilisateurs : modification "+nom)}else{o.id=Date.now();D.utilisateurs.push(o);log("Utilisateurs : ajout "+nom)}
 if(adm)D.params.pin=pin;
 edit=null;save();render();
}
function del(k,id){if(!can(k,"s"))return alert("Action non autorisée");if(k=="utilisateurs"&&id===1)return alert("L’administrateur ne peut pas être supprimé.");const r0=D[k].find(x=>x.id==id);let msg="Supprimer cet enregistrement ?";
 if(k=="factures"&&r0)msg="Supprimer la facture "+(r0.num||"")+" ? Le stock des produits vendus sera remis.";
 else if(k=="commandes"&&r0)msg="Supprimer le bon de commande "+(r0.num||"")+" ?"+(r0.recu?" Le stock reçu sera retiré.":"");
 else if(DT[k]&&r0)msg="Supprimer "+DT[k].n.toLowerCase()+" "+(r0.num||"")+" ?";
 if(confirm(msg)){if(k=="factures"&&r0&&dedF(r0.statut))stk(r0.lignes,1);if(k=="commandes"&&r0&&r0.recu)stk(r0.lignes,-1);D[k]=D[k].filter(r=>r.id!=id);log(M[k].n+" : suppression");save();render()}}

function entree(){
 if(!can("reappro","a"))return alert("Action non autorisée");
 const p=D.produits.find(x=>x.id==$("rps").value),q=num($("rqt").value);
 if(!p||q<=0)return alert("Choisissez un produit et une quantité.");
 const f=D.fournisseurs.find(x=>x.id==$("rfs").value);
 p.stock=num(p.stock)+q;if(num($("rpa").value)>0)p.achat=num($("rpa").value);p.depot=$("rdp").value;
 D.entrees.unshift({id:Date.now(),date:$("rdt").value,produit:p.nom,fournisseur:f?f.nom:"",depot:p.depot,qte:q,prix:num(p.achat)});
 log("Entrée en stock : "+q+" × "+p.nom);save();render();
}
function reappro(){
 return `<div class="sec"><label>Produit</label><input placeholder="🔍 Rechercher un produit…" oninput="rp=this.value;rs('rps',rpo(),rp)"><select id="rps">${rpo()}</select>

let vq2="",cq="",cli=null,rem=0,mode="Espèces",recu="";
function items(){return D.produits.map(p=>({...p,id:"p"+p.id})).concat(D.services.map(s=>({id:"s"+s.id,nom:s.nom,vente:s.prix,svc:1})))}
function vcards(){

 return L.length?L.map(p=>`<div class="pc" onclick="addP('${p.id}')"><div class="im">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:p.svc?"🛠️":"🔧"}</div><div><h4>${esc(p.nom)}</h4>${p.svc?"":`<div class="rf">Réf : ${esc(p.ref)}</div><div class="i">Catégorie : ${esc(p.categorie)}</div>`}<div class="pr">${fmt(p.vente)}</div>${p.svc?"":`<div class="i">Prix d’achat : ${fmt(p.achat)}</div><div class="i">Stock : ${p.stock}</div><div class="i">Seuil d’alerte : ${p.seuil}</div><div class="i">Dépôt : ${esc(p.depot)}</div><div class="i">Emplacement : ${esc(p.emplacement)}</div><div class="i">Remplacement : ${esc(p.remplacement)}</div><div class="i">Véhicules : ${esc(p.vehicules)}</div>`}</div></div>`).join(""):`<div class="empty">Aucun produit. Ajoutez-en dans « Produits ».</div>`;

function copts(){const f=cq.toLowerCase();return D.clients.filter(c=>!f||c.nom.toLowerCase().includes(f)).map(c=>`<option value="${c.id}" ${cli==c.id?"selected":""}>${esc(c.nom)}${c.id==D.clients[0].id?" (par défaut)":""}</option>`).join("")}

function tt(){const b=sum(cart,l=>l.q*l.pu);document.getElementById("vtb").textContent="Total brut : "+fmt(b);document.getElementById("vtt").textContent=fmt(b*(1-num(rem)/100))}
function addP(id){
 const it=items().find(x=>x.id==id),l=cart.find(x=>x.id==id),n=(l?l.q:0)+1;
 if(!it.svc&&n>num(it.stock))return alert("Stock insuffisant ("+it.stock+")");
 if(l)l.q=n;else cart.push({id,nom:it.nom,q:1,pu:num(it.vente),pa:num(it.achat),svc:it.svc});

}
function qty(i,d){const l=cart[i],n=l.q+d;if(n<1)return;if(!l.svc){const p=D.produits.find(x=>"p"+x.id==l.id);if(n>num(p.stock))return alert("Stock insuffisant")}l.q=n;render()}

function encaisser(){

 const total=Math.round(sum(cart,l=>l.q*l.pu)*(1-num(rem)/100)),paye=recu===""?total:num(recu),c=D.clients.find(x=>x.id==cli)||D.clients[0];

 if(!cart.length)return alert("Ajoutez un produit.");
 const total=sum(cart,l=>l.q*l.pu),cout=sum(cart,l=>l.q*l.pa);

 <div class="sc"><table style="min-width:640px"><tr><th>Date</th><th>Opération</th><th>Réf.</th><th style="${R}">Montant</th><th style="${R}">${isC?"Encaissé":"Payé"}</th><th>Statut / mode</th><th></th></tr>${ev.map(x=>`<tr ${x.o?`onclick="ov(()=>{${x.o}})" style="cursor:pointer"`:""}><td>${dtf(x.d)}</td><td><b>${x.ty}</b>${x.l?`<div style="font-size:12px;font-weight:600">${esc(x.l)}</div>`:""}</td><td>${esc(x.r||"")}</td><td style="${R}">${x.a==null?"":fmtn(x.a)}</td><td style="${R}">${x.p==null?"":fmtn(x.p)}</td><td>${esc(x.s||"")}</td><td>${x.o?`<button class="b s" title="Revoir le document" onclick="event.stopPropagation();ov(()=>{${x.o}})">👁</button>`:""}</td></tr>`).join("")||`<tr><td colspan="7">Aucune opération enregistrée.</td></tr>`}</table></div></div>
 <div class="bar noprint" style="margin-top:12px"><button class="b" onclick="closeM()">Fermer</button><button class="b o" onclick="dPdf()">📄 PDF</button></div>`,900);
}
const _dash=dash;dash=function(){return `<div class="dsh">${_dash()}</div>`};

function ncClose(){const o=$("md2");if(o)o.remove()}
function newCli(kind){if(!can("clients","a"))return alert("Action non autorisée");
 kind=kind||"clients";const fo=kind=="fournisseurs";ncClose();
 const d=document.createElement("div");d.id="md2";
 d.innerHTML=`<div class="box"><h2 class="t" style="font-size:28px">Nouveau ${fo?"fournisseur":"client"}</h2><div style="display:grid;gap:10px;margin:14px 0"><div><label>Nom</label><input id="nc_n"></div><div><label>Téléphone</label><input id="nc_t" type="tel"></div><div><label>Adresse</label><input id="nc_a"></div></div><div class="bar" style="justify-content:space-between"><button class="b" onclick="ncClose()">Annuler</button><button class="b o" onclick="ncSave('${kind}')">Enregistrer</button></div></div>`;
 document.body.appendChild(d);setTimeout(()=>{const i=$("nc_n");if(i)i.focus()},50);
}
function ncSave(kind){
 const nom=$("nc_n").value.trim();if(!nom)return alert("Saisissez le nom.");
 const r={id:Date.now(),nom,tel:$("nc_t").value,adresse:$("nc_a").value};if(kind=="clients"){r.email="";r.solde=0}
 D[kind].push(r);log((kind=="clients"?"Clients":"Fournisseurs")+" : ajout "+nom);save();
 const clr=s=>{s.removeAttribute("size");const i=s.previousElementSibling;if(i&&i.tagName=="INPUT")i.value="";else if(i&&i.previousElementSibling&&i.previousElementSibling.tagName=="INPUT")i.previousElementSibling.value=""};
 if(kind=="clients"&&$("cs")){cli=r.id;cq="";const s=$("cs");s.innerHTML=copts();clr(s);s.value=String(r.id)}
 else if($("dp")){dq="";const s=$("dp");s.innerHTML=dpo();clr(s);s.value=nom}
 ncClose();
}

const SKIP=["img","id","lignes","pays","k","svc"];
const hay=o=>nz(Object.keys(o).filter(k=>!SKIP.includes(k)).map(k=>{const v=o[k];return typeof v=="number"?v+" "+fmtn(v):v}).join(" ")+" "+(o.lignes||[]).map(l=>l.nom||l.d).join(" "));
const hit=(o,t)=>{const w=nz(t).split(/\s+/).filter(Boolean);if(!w.length)return true;const h=hay(o);return w.every(x=>h.includes(x))};
function fillFac(id){
 const f=D.factures.find(x=>x.id==id);if(!f)return;EDF=id;
 FL=(f.lignes&&f.lignes.length)?f.lignes.map(lnorm):[{d:"Vente",q:1,pu:num(f.total)}];
 const c=D.clients.find(x=>x.nom==f.client);cli=c?c.id:"";cq="";
 const cs=$("cs");cs.innerHTML=copts();
 if(c)cs.value=c.id;else{cs.insertAdjacentHTML("afterbegin",`<option value="">${esc(f.client)}</option>`);cs.value=""}
 $("fn").value=f.num||"";$("fd").value=f.date||today();$("fe").value=f.echeance||f.date||today();
 const fs=$("fs");["Annulée",f.statut].forEach(x=>{if(x&&![...fs.options].some(o=>o.text==x))fs.add(new Option(x))});fs.value=f.statut||"Validée";
 $("fm").value=f.mode||"Espèces";$("fr").value=num(f.remise);$("fa").value=num(f.paye);
 $("fl").innerHTML=fls();facT();
 document.querySelector("#md h2.t").textContent="Modifier — Facture "+(f.num||"");
}
function fillDoc(k,id){
 const r=D[k].find(x=>x.id==id);if(!r)return;EDD=id;
 FL=(r.lignes&&r.lignes.length)?r.lignes.map(lnorm):[{d:"Montant global",q:1,pu:num(r.total)}];
 const who=r.client||r.fournisseur||"",dp=$("dp");dq="";dp.innerHTML=dpo();
 if(![...dp.options].some(o=>o.text==who))dp.insertAdjacentHTML("afterbegin",`<option>${esc(who)}</option>`);
 dp.value=who;$("dd").value=r.date||today();
 const ds=$("ds");if(r.statut&&![...ds.options].some(o=>o.text==r.statut))ds.add(new Option(r.statut));ds.value=r.statut||ds.value;
 if($("dref"))$("dref").value=r.ref||"";$("fr").value=num(r.remise);if($("dpay"))$("dpay").value=num(r.paye);
 $("fl").innerHTML=fls();facT();
 document.querySelector("#md h2.t").textContent="Modifier — "+DT[k].n+" "+(r.num||"");
}
const _openFac=openFac;openFac=function(id){DK="factures";pq="";EDF=null;_openFac();if(id!=null)fillFac(id)};
const _openDoc=openDoc;openDoc=function(k,id){EDD=null;_openDoc(k);if(id!=null)fillDoc(k,id)};
function editBtns(k,id){return (can(k,"m")?`<button class="b" onclick="openF('${k}',${id})">✏️ Modifier</button>`:"")+(can(k,"s")?`<button class="b o" onclick="closeM();del('${k}',${id})">🗑 Supprimer</button>`:"")}
function delEntree(id){if(!can("reappro","s"))return alert("Action non autorisée");const e=D.entrees.find(x=>x.id==id);if(!e)return;if(!confirm("Supprimer cette entrée ? Le stock de « "+e.produit+" » sera diminué de "+e.qte+"."))return;const p=D.produits.find(x=>x.nom==e.produit);if(p)p.stock=num(p.stock)-num(e.qte);D.entrees=D.entrees.filter(x=>x.id!=id);log("Entrée en stock supprimée : "+e.produit);save();render()}
function editEntree(id){if(!can("reappro","m"))return alert("Action non autorisée");const e=D.entrees.find(x=>x.id==id);if(!e)return;
 mod(`<h2 class="t" style="font-size:28px">Modifier l’entrée — ${esc(e.produit)}</h2><label>Date</label><input id="ee_d" type="date" value="${esc(e.date)}"><label>Quantité reçue</label><input id="ee_q" type="number" value="${num(e.qte)}"><label>Prix d’achat</label><input id="ee_p" type="number" value="${num(e.prix)}"><div class="bar" style="justify-content:space-between"><button class="b" onclick="closeM()">Annuler</button><button class="b o" onclick="saveEntree(${id})">Enregistrer</button></div>`)}
function saveEntree(id){const e=D.entrees.find(x=>x.id==id);if(!e)return;const q=num($("ee_q").value);if(q<=0)return alert("Quantité invalide.");const p=D.produits.find(x=>x.nom==e.produit);if(p)p.stock=num(p.stock)-num(e.qte)+q;e.qte=q;e.prix=num($("ee_p").value);e.date=$("ee_d").value;log("Entrée en stock modifiée : "+e.produit);save();render()}
render();lock();
